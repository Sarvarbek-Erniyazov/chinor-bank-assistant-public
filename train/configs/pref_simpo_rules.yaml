# C4 §6 preference arm: simpo_rules (fresh rsLoRA on sft-merged; train/pref.py). Not launched before GTD's queue.
model: <workspace>/chinor/results/sft-merged-l14b-v1.2-s0/model
pairs: data/pref/v1/pairs_rules.jsonl
loss: simpo
beta: 2.0
gamma: 1.0
max_length: 1024
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
warmup_ratio: 0.1
num_train_epochs: 2
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
