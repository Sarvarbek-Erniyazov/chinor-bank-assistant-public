# Throughput probe (20 steps, no eval): Qwen3-14B-Base full fine-tuning bf16, 8-bit AdamW
# Shared hyperparameters (C2a §1): effective batch 16, cosine schedule, 3 % warmup, 3 epochs, LoRA on all
# linear projections; embeddings and lm_head are never trained. train/sft.py asserts these.
model: Qwen/Qwen3-14B-Base
max_length: 1024
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
warmup_ratio: 0.03
num_train_epochs: 3
weight_decay: 0.0
optim: adamw_bnb_8bit
group_by_length: true
eval_steps: 50
save_steps: 100
logging_steps: 10
full_ft: true
